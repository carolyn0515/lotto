{% extends "lotto/base.html" %}

{% block title %}코인 받기 | Lotto Lab{% endblock %}

{% block content %}
<section class="hero">
    <div class="hero-panel">
        <p class="eyebrow">Bonus Coin</p>
        <h1>가상 광고를 보고 코인을 받아요.</h1>
        <p class="lead">10초 시청 후 보상 버튼이 활성화됩니다. 실제 광고 연동 대신 과제용 가상 보상 흐름으로 동작합니다.</p>
    </div>
    <aside class="card">
        <div class="stat">
            <span class="stat-label">보상</span>
            <span class="stat-value">+5 코인</span>
        </div>
    </aside>
</section>

<section class="card form-card">
    <div class="ad-frame">
        <video id="ad-video" controls autoplay muted loop>
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
            브라우저가 video 태그를 지원하지 않습니다.
        </video>
        <div class="ad-copy">
            <h2>LOTTO BONUS AD</h2>
            <p id="countdown">10초 후 보상을 받을 수 있습니다.</p>
        </div>
    </div>

    <form method="post" class="section">
        {% csrf_token %}
        <button class="button full" id="reward-button" type="submit" disabled>보상 받기</button>
    </form>
    <div class="actions">
        <a class="button ghost" href="{% url 'lotto:home' %}">홈으로</a>
    </div>

    <script>
        let remainingSeconds = 10;
        const countdownElement = document.getElementById("countdown");
        const rewardButton = document.getElementById("reward-button");

        const timer = setInterval(function () {
            remainingSeconds -= 1;

            if (remainingSeconds > 0) {
                countdownElement.textContent = remainingSeconds + "초 후 보상을 받을 수 있습니다.";
            } else {
                clearInterval(timer);
                countdownElement.textContent = "광고 시청이 완료되었습니다. 보상을 받을 수 있습니다.";
                rewardButton.disabled = false;
            }
        }, 1000);
    </script>
</section>
{% endblock %}
