{% extends "lotto/base.html" %}

{% block title %}회차 생성 | Lotto Lab{% endblock %}

{% block content %}
<section class="card form-card">
    <p class="eyebrow">New Draw</p>
    <h1>새 회차 생성</h1>
    <p class="lead">판매 마감 시간을 입력하면 다음 회차 번호가 자동으로 생성됩니다.</p>

    <form method="post" class="section">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button full" type="submit">회차 생성</button>
    </form>

    <div class="actions">
        <a class="button ghost" href="{% url 'lotto:admin_draw_list' %}">관리자 추첨 페이지로</a>
    </div>
</section>
{% endblock %}
